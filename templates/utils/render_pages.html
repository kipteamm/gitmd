{% macro render_pages(node) %}
{% for child in node.children %}
    {% if child.type == "directory" %}
    <li>
        <details open>
            <summary>
                {{ child.name }}
            </summary>

            {{ render_pages(child) }}
        </details>
    </li>
    {% else %}
    <li>
        <button type="button" class="file" data-path="{{ child.path }}">
            {{ child.name }}
        </button>
    </li>
    {% endif %}
{% endfor %}
{% endmacro %}

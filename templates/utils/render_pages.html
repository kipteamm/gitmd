{% macro render_pages(node) %}
<ul>
{% for child in node.children %}
    {% if child.type == "directory" %}
    <li>
        <details open>
            <summary class="flex-ver">
                {{ child.name.title() }}
                {% include "icons/marker.html" %}
            </summary>

            {{ render_pages(child) }}
        </details>
    </li>
    {% else %}
    <li>
        <button type="button" class="file" data-path="{{ child.path }}"{% if child.path == 'index.md' %} id="index-file"{% endif %}>
            {{ child.name.title() }}
        </button>
    </li>
    {% endif %}
{% endfor %}
</ul>
{% endmacro %}
